services:
  - type: web
    name: unnati-charitable-api
    runtime: node
    plan: free
    rootDir: Backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        sync: false
      - key: CASHFREE_APP_ID
        sync: false
      - key: CASHFREE_SECRET_KEY
        sync: false
      - key: CASHFREE_ENV
        value: sandbox
      - key: CASHFREE_BASE_URL
        value: https://sandbox.cashfree.com/pg
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_URL
        sync: false
